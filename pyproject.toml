[project]
name = "ai-gf"
version = "0.1.0"
description = "Single-owner Instagram DM companion bot with persona, mood, and proactive messaging."
requires-python = ">=3.11,<3.14"
dependencies = [
    "instagrapi>=2.1.0",
    "ollama>=0.4.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
